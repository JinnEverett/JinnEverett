<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="t d">
  <title id="t">Vu Bao Minh — Backend Engineer</title>
  <desc id="d">Name and role banner</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <style>
    .name { font: 700 52px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; letter-spacing: -1px; }
    .role { font: 500 19px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #8b949e; letter-spacing: 0.5px; }
  </style>
  <text x="450" y="78" text-anchor="middle" class="name">Vu Bao Minh</text>
  <rect x="390" y="96" width="120" height="4" rx="2" fill="url(#g)">
    <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
    <animate attributeName="x" values="430;390;430" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
  </rect>
  <text x="450" y="136" text-anchor="middle" class="role">BACKEND ENGINEER  ·  HANOI, VIETNAM</text>
</svg>
