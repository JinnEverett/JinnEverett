name: Generate profile summary cards

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/summary-cards.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 7
          THEME: github
          ANIMATION: fade
          AUTO_PUSH: false

      # the action clears its output folder on each run, so park the light cards
      - run: mv profile-summary-card-output/github "$RUNNER_TEMP/light"

      - name: Cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 7
          THEME: github_dark
          ANIMATION: fade
          AUTO_PUSH: false

      - name: Commit cards
        run: |
          mv "$RUNNER_TEMP/light" profile-summary-card-output/github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output
          git diff --cached --quiet || git commit -m "Generate profile summary cards"
          git push
